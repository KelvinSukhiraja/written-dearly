<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp Business invitation — fictional review</title>
<style>body{margin:0;background:#f5f6f7;color:#26313c;font:16px/1.6 system-ui}main{max-width:680px;margin:40px auto;padding:24px;background:white;border:1px solid #dce1e6;border-radius:16px}h1{font:32px Georgia}button,select{padding:12px;border:1px solid #b5c0ca;border-radius:8px;background:#edf2f6;font:inherit}p{overflow-wrap:anywhere}.notice{background:#f0f3f6;padding:16px;border-radius:8px}label{display:block;margin:16px 0}button:disabled{opacity:.45}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #46749b;outline-offset:3px}@media(max-width:720px){main{margin:16px;padding:20px}h1{font-size:26px}}</style>
<main><p>Review fixture · Fictional data · No sending</p><h1>Send with WhatsApp Business</h1><label>Review state <select id="state"><option>Template pending</option><option>Loading</option><option>Ready</option><option>Sending</option><option>Accepted</option><option>Delivered</option><option>Failed</option><option>Unknown</option><option>No guest</option></select></label><section id="content" aria-live="polite"></section></main>
<script>const content=document.querySelector('#content');const state=document.querySelector('#state');function draw(){const s=state.value;const ready=s==='Ready';const text={'Template pending':'Business API sending is not active. The approved template and server setup are required.',Loading:'Loading delivery setup…',Ready:'Review this exact template before sending.',Sending:'Sending… Keep this view open.',Accepted:'Accepted by WhatsApp. Delivery is not yet confirmed.',Delivered:'Delivered',Failed:'WhatsApp rejected the invitation. Check the recipient, template and provider setup.',Unknown:'Sending outcome is unknown. Do not resend; reconcile with Meta first.','No guest':'Add a guest with an international phone number first.'}[s];content.innerHTML='<p class="notice">'+text+'</p>'+(s==='Loading'||s==='No guest'?'':'<p>To: +44 7700 900123 · wedding_invitation · en_US</p><p>Hi Alex, you\'re invited to celebrate the wedding of Amelia &amp; James. We\'ve reserved 3 places for your invitation. View the details and RSVP here: https://wedding.example/i/amelia-james?guest=fictional</p>')+(ready?'<label><input type="checkbox" id="consent"> This recipient agreed to receive this wedding invitation on WhatsApp.</label>':'')+'<button id="send" disabled>Send invitation via Business API</button><p>API delivery status is separate from the manual sent marker.</p>';if(ready)document.querySelector('#consent').onchange=e=>document.querySelector('#send').disabled=!e.target.checked;document.querySelector('#send').onclick=()=>{state.value='Sending';draw()}}state.onchange=draw;draw();</script></html>
